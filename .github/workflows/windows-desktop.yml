name: Build Shree Khata Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: npm install --no-audit --no-fund
      - name: Check desktop source
        run: npm run check
      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-FileHash dist/Shree-Khata-Setup-1.0.0.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  Shree-Khata-Setup-1.0.0.exe" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shree-Khata-Windows-Setup
          path: |
            dist/Shree-Khata-Setup-1.0.0.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
