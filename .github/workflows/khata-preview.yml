name: Build Shree Khata preview APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/khata-preview.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify Android preview
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          ANDROID_JAR=$(find "$SDK/platforms" -name android.jar | sort -V | tail -1)
          mkdir -p build/{classes,dex,res/drawable}
          cd build
          cat > AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.shreekhata.preview" android:versionCode="1" android:versionName="1.0-preview">
            <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="35"/>
            <application android:label="Shree Khata" android:icon="@drawable/khata" android:allowBackup="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".Home" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          EOF
          cat > res/drawable/khata.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#123447" android:pathData="M0,0h48v48h-48z"/><path android:fillColor="#eed5a0" android:pathData="M10,9h28v30h-28z"/><path android:fillColor="#08785e" android:pathData="M13,9h4v30h-4z M21,16h12v2h-12z M21,23h12v2h-12z"/></vector>
          EOF
          cat > Home.java <<'EOF'
          package com.shreekhata.preview;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.TextView;
          public class Home extends Activity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  Intent launch = new Intent(Intent.ACTION_VIEW, Uri.parse("https://shree-khata.princesaini2344.chatgpt.site"));
                  Bundle options = new Bundle();
                  options.putBinder("android.support.customtabs.extra.SESSION", null);
                  launch.putExtras(options);
                  try { startActivity(launch); finish(); }
                  catch (ActivityNotFoundException e) {
                      TextView text = new TextView(this);
                      text.setText("Shree Khata खोलने के लिए Android browser चालू करें।");
                      setContentView(text);
                  }
              }
          }
          EOF
          javac --release 8 -classpath "$ANDROID_JAR" -d classes Home.java
          "$BT/d8" --min-api 24 --lib "$ANDROID_JAR" --output dex classes/com/shreekhata/preview/Home.class
          "$BT/aapt2" compile --dir res -o compiled.zip
          "$BT/aapt2" link -I "$ANDROID_JAR" --manifest AndroidManifest.xml -o unsigned.apk compiled.zip
          (cd dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/preview.jks" -storepass android -keypass android -alias preview -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Shree Khata Preview"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/preview.jks" --ks-pass pass:android --out Shree-Khata.apk aligned.apk
          "$BT/apksigner" verify --verbose Shree-Khata.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shree-Khata-APK
          path: build/Shree-Khata.apk
      - name: Attach APK to preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "khata-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" build/Shree-Khata.apk --prerelease --title "Shree Khata Android preview" --notes "Android launcher for the live Shree Khata service. Uses the device browser."
